<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Requests</title>

    <link rel="stylesheet" href="my-requests.css">
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar">

        <h2>🎓 Outpass</h2>

        <nav>
            <a href="student-dashboard.html">Dashboard</a>
            <a href="apply-outpass.html">Apply Outpass</a>
            <a href="my-requests.html">My Requests</a>
            <a href="history.html">History</a>
        </nav>

        <a href="index.html" class="logout">Logout</a>

    </aside>


    <!-- Main Content -->
    <main class="main-content">

        <header class="page-header">

            <div>
                <h1>My Requests</h1>
                <p>View and track your outpass requests</p>
            </div>

            <a href="apply-outpass.html" class="apply-btn">
                + Apply Outpass
            </a>

        </header>


        <!-- Filter -->
        <section class="filter-section">

            <label for="statusFilter">
                Filter by Status
            </label>

            <select id="statusFilter">

                <option value="all">All Requests</option>
                <option value="Pending">Pending</option>
                <option value="Approved">Approved</option>
                <option value="Rejected">Rejected</option>

            </select>

        </section>


        <!-- Requests Table -->
        <section class="requests-container">

            <table>

                <thead>

                    <tr>
                        <th>Request ID</th>
                        <th>Destination</th>
                        <th>From Date</th>
                        <th>To Date</th>
                        <th>Type</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="requestsTable">

                    <tr>
                        <td colspan="7">
                            Loading requests...
                        </td>
                    </tr>

                </tbody>

            </table>

        </section>

    </main>


    <script src="my-requests.js"></script>

</body>

</html>

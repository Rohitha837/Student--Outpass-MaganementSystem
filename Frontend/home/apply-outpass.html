<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply Outpass</title>

    <link rel="stylesheet" href="apply-outpass.css">
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar">

        <h2>🎓 Outpass</h2>

        <nav>
            <a href="student-dashboard.html">Dashboard</a>
            <a href="apply-outpass.html" class="active">Apply Outpass</a>
            <a href="#">My Requests</a>
            <a href="#">History</a>
        </nav>

        <a href="../index.html" class="logout">Logout</a>

    </aside>


    <!-- Main Content -->
    <main class="main-content">

        <header class="page-header">
            <div>
                <h1>Apply for Outpass</h1>
                <p>Submit your outpass request</p>
            </div>
        </header>


        <!-- Outpass Form -->
        <section class="form-container">

            <form id="outpassForm">

                <div class="form-group">
                    <label for="destination">Destination</label>
                    <input
                        type="text"
                        id="destination"
                        placeholder="Enter destination"
                    >
                </div>


                <div class="form-group">
                    <label for="reason">Reason</label>
                    <textarea
                        id="reason"
                        rows="4"
                        placeholder="Enter reason for outpass"
                    ></textarea>
                </div>


                <div class="form-row">

                    <div class="form-group">
                        <label for="fromDate">From Date</label>
                        <input type="date" id="fromDate">
                    </div>

                    <div class="form-group">
                        <label for="toDate">To Date</label>
                        <input type="date" id="toDate">
                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">
                        <label for="outTime">Out Time</label>
                        <input type="time" id="outTime">
                    </div>

                    <div class="form-group">
                        <label for="returnTime">Return Time</label>
                        <input type="time" id="returnTime">
                    </div>

                </div>


                <!-- Emergency Request -->
                <div class="emergency-box">

                    <label class="checkbox-label">

                        <input
                            type="checkbox"
                            id="emergency"
                        >

                        <span>
                            🚨 Emergency Outpass
                        </span>

                    </label>

                    <p>
                        Select this option only for emergency situations.
                    </p>

                </div>


                <div class="form-group">
                    <label for="remarks">Additional Remarks</label>

                    <textarea
                        id="remarks"
                        rows="3"
                        placeholder="Any additional information..."
                    ></textarea>
                </div>


                <div class="form-actions">

                    <a
                        href="student-dashboard.html"
                        class="cancel-btn"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="submit-btn"
                    >
                        Submit Request
                    </button>

                </div>

            </form>

        </section>

    </main>


    <script src="../js/student.js"></script>

</body>
</html>

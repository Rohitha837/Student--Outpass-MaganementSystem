<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Student Outpass Management System - Student Login"
    >

    <title>Student Login | Outpass Management System</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="auth-page">

        <section class="auth-card" aria-labelledby="login-title">

            <!-- Logo / Brand -->
            <div class="brand">

                <div class="brand-icon" aria-hidden="true">
                    🎓
                </div>

                <h1>
                    Student Outpass
                </h1>

                <p>
                    Management System
                </p>

            </div>


            <!-- Login Heading -->
            <div class="auth-heading">

                <h2 id="login-title">
                    Welcome Back
                </h2>

                <p>
                    Sign in to manage your outpass requests
                </p>

            </div>


            <!-- Login Form -->
            <form id="loginForm" novalidate>

                <!-- Student ID / Email -->
                <div class="form-group">

                    <label for="identifier">
                        Student ID or Email
                    </label>

                    <input
                        type="text"
                        id="identifier"
                        name="identifier"
                        placeholder="Enter Student ID or Email"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <div class="password-label-row">

                        <label for="password">
                            Password
                        </label>

                        <a
                            href="forgot-password.html"
                            class="forgot-link"
                        >
                            Forgot Password?
                        </a>

                    </div>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- Sign In -->
                <button
                    type="submit"
                    class="signin-btn"
                >
                    Sign In
                </button>

            </form>


            <!-- Sign Up -->
            <div class="signup-section">

                <span>
                    Don't have an account?
                </span>

                <a
                    href="signup.html"
                    class="signup-link"
                >
                    Sign Up
                </a>

            </div>


            <!-- Security Information -->
            <div class="security-note">

                <span aria-hidden="true">🔒</span>

                <span>
                    Your account information is securely protected.
                </span>

            </div>


            <!-- Back to Home -->
            <div class="back-home">

                <a href="home.html">
                    ← Back to Home
                </a>

            </div>

        </section>

    </main>


    <script src="login.js"></script>

</body>

</html>

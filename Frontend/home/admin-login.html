<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Admin Login - Student Outpass Management System"
    >

    <title>Admin Login | Outpass Management System</title>

    <link rel="stylesheet" href="admin-login.css">
</head>

<body>

    <main class="admin-login-page">

        <section
            class="admin-login-card"
            aria-labelledby="admin-login-title"
        >

            <!-- Brand -->
            <div class="brand">

                <div
                    class="brand-icon"
                    aria-hidden="true"
                >
                    🛡️
                </div>

                <h1>Student Outpass</h1>

                <p>Management System</p>

            </div>


            <!-- Heading -->
            <div class="login-heading">

                <span class="admin-badge">
                    ADMIN PORTAL
                </span>

                <h2 id="admin-login-title">
                    Admin Login
                </h2>

                <p>
                    Sign in to manage student verification
                    and outpass approvals.
                </p>

            </div>


            <!-- Login Form -->
            <form
                id="adminLoginForm"
                novalidate
            >

                <div class="form-group">

                    <label for="adminEmail">
                        Admin Email
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        name="adminEmail"
                        placeholder="Enter admin email"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        name="adminPassword"
                        placeholder="Enter admin password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="admin-login-btn"
                >
                    Sign In as Admin
                </button>

            </form>


            <!-- Security Notice -->
            <div class="security-note">

                <span
                    aria-hidden="true"
                >
                    🔒
                </span>

                <p>
                    This portal is restricted to authorized
                    administrators only.
                </p>

            </div>


            <!-- Back -->
            <div class="back-home">

                <a href="home.html">
                    ← Back to Home
                </a>

            </div>

        </section>

    </main>


    <script src="admin-login.js"></script>

</body>

</html>
